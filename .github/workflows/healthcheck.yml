# Внешняя проверка живости лендинга.
#
# Лендинг — единственная точка входа для входящих обращений по домену, и молчаливое
# падение стоит сделки: покупатель не пишет «у вас 502», он просто уходит. Проверка
# живёт на раннерах GitHub, то есть снаружи и GitHub Pages, и AWS: если падает сам
# Pages, проверка об этом сообщит, а не упадёт вместе с ним.
#
# Алерт — штатное письмо GitHub о провалившемся workflow. Оно уходит владельцу
# репозитория без каких-либо сторонних сервисов и без ещё одного аккаунта.
#
# ВАЖНО: cron ниже написан как «каждые пять минут», но так он НЕ работает.
# Замер за первые двое суток (11–13.09.2026, 14 запусков по расписанию): интервалы
# между запусками составили от 105 до 300 минут. GitHub жёстко режет частые
# расписания в репозиториях без активности, и пятиминутный cron превращается
# в «примерно раз в два-пять часов».
#
# Практическое следствие: падение лендинга может остаться незамеченным до пяти часов.
# Для «увидеть раньше покупателя» этого может не хватать — решение за владельцем
# (`RSOL-008`). Значение cron оставлено пятиминутным осознанно: оно задаёт верхнюю
# границу частоты, а реальную выдаёт GitHub. Ставить сюда большее число смысла нет.
#
# Вторая особенность: в репозитории без коммитов 60 дней GitHub отключает расписание
# сам и присылает об этом письмо. Домен продаётся долго, так что этот день наступит —
# тогда расписание включается кнопкой в Actions.

name: healthcheck

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'URL для проверки. Заведомо битой ссылкой проверяется сам алерт.'
        required: false
        default: 'https://russia.solutions'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что лендинг отдаёт страницу
        env:
          TARGET: ${{ github.event.inputs.target || 'https://russia.solutions' }}
          # Ровно то, ради чего страница существует. Проверять один код 200 мало:
          # GitHub Pages отдаёт 200 и на страницу-заглушку при слетевшем CNAME.
          MARKER: 'premium domain for sale'
          ATTEMPTS: '6'
          GAP: '60'
        run: |
          set -u
          for i in $(seq 1 "$ATTEMPTS"); do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$TARGET" || echo 000)
            if [ "$code" = "200" ] && grep -qF "$MARKER" /tmp/body; then
              echo "попытка $i/$ATTEMPTS: $code, маркер на месте — лендинг жив"
              exit 0
            fi
            if [ "$code" = "200" ]; then
              echo "попытка $i/$ATTEMPTS: код 200, но маркера «$MARKER» на странице нет"
            else
              echo "попытка $i/$ATTEMPTS: код $code"
            fi
            # Пауза между попытками растягивает проверку на пять минут: разовый сбой
            # сети или деплой Pages не должен поднимать тревогу, а вот пять минут
            # подряд — уже настоящее падение.
            [ "$i" -lt "$ATTEMPTS" ] && sleep "$GAP"
          done
          echo "::error::russia.solutions недоступен дольше пяти минут — последний код $code"
          echo "--- первые 400 байт последнего ответа ---"
          head -c 400 /tmp/body || true
          exit 1
